          tests/test_evaluation_jsonl.py
          tests/test_evaluation_semantics.py
          tests/test_evaluation_session_semantics.py
          tests/test_evaluation_turn_semantics.py
          tests/test_evaluation_coordinator.py
          tests/test_evaluation_batch_coordinator.py
          tests/test_evaluation_dispatch_failure.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test frontend dependency resolution and source-map compatibility
        run: node --test scripts/frontend_dependencies.test.mjs
        working-directory: .
      - name: Test guarded formatting
        run: node --test scripts/format.test.mjs
        working-directory: .
      - name: Test documentation checker
        run: node --test scripts/check_docs.test.mjs
        working-directory: .
      - name: Check documentation links and translations
        run: node scripts/check_docs.mjs
        working-directory: .
      - name: Check documentation formatting
        run: node scripts/format.mjs markdown --check
        working-directory: .
      - run: npm run lint
      - name: Test read-only result rendering and translations
        run: npm test
      - run: npm run format:check
      - run: npm run build
