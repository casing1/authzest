name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  generated-contract-cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e . 'pytest>=7.4,<9.0' 'typer==0.27.3'
      - name: Check CLI help with the minimum supported Typer
        run: |
          python -m authzest --help
          python -m authzest repo-suggest --help
      - name: Check verification module in a fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_verification.py
      - name: Check bounded read-only result contracts without optional UI dependencies
        run: python -m pytest tests/test_result_viewer.py
      - name: Check controls module in another fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_controls.py
      - name: Check inert external-copy contracts without target filesystem access
        run: python -m pytest tests/test_repository_copy_plan.py
      - name: Check pure external interfaces and supplied verification contracts
        run: python -m pytest tests/test_repository_test_interface.py tests/test_repository_cases.py tests/test_repository_verification.py tests/test_repository_verification_failures.py
      - name: Check distinct HTTP PoC contracts without a provider or target
        run: python -m pytest tests/test_repository_http_proposal.py
      - name: Check HTTP policy and A/B preparation with fake collaborators
        run: python -m pytest tests/test_repository_http_cases.py tests/test_repository_http_verification.py tests/test_repository_http_transport.py tests/test_repository_http_runtime_profile.py tests/test_repository_http_guest_entry.py
      - name: Check HTTP A/B image inputs, contexts and inert contents
        run: python -m pytest tests/test_repository_http_image_inputs.py tests/test_repository_http_image_context.py tests/test_repository_http_image_contents.py
      - name: Check HTTP private files, checkpoints and sealed A inputs
        run: python -m pytest tests/test_repository_http_copy_plan.py tests/test_repository_http_files.py tests/test_repository_http_file_session.py tests/test_repository_http_session_failures.py tests/test_repository_http_staging.py tests/test_repository_http_staging_failures.py
      - name: Check HTTP profile, client, metadata and stopped configuration offline
        run: python -m pytest tests/test_repository_http_runtime_input.py tests/test_repository_http_client_pin.py tests/test_repository_http_engine_http.py tests/test_repository_http_engine_http_failures.py tests/test_repository_http_preflight.py tests/test_repository_http_preflight_failures.py tests/test_repository_http_container_inspect.py tests/test_repository_http_runtime_connection.py
      - name: Check external private file decisions with owned inert temporary files
        run: python -m pytest tests/test_repository_origin.py tests/test_repository_files.py tests/test_repository_file_session.py tests/test_repository_session_failures.py
      - name: Check external runtime foundation with inert files and fake guest peers
        run: python -m pytest tests/test_repository_runtime_checkpoint.py tests/test_repository_staging.py tests/test_repository_staging_failures.py tests/test_repository_runtime_profile.py tests/test_repository_http.py tests/test_repository_guest_entry.py
      - name: Check private workspace in a fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_workspace.py
      - name: Check workspace failure paths in another fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_workspace_failures.py
      - name: Check copy session in a fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_session.py
      - name: Check session refusal paths in another fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_session_failures.py
      - name: Check pure lifecycle model in a fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_lifecycle.py
      - name: Check lifecycle failure paths in another fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_lifecycle_failures.py
      - name: Check maintained relay in a fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_http.py
      - name: Check relay refusal paths in another fresh Python interpreter
        run: python -m pytest tests/test_generated_repair_http_failures.py
      - name: Check image-owned guest entry source without launching a guest
        run: python -m pytest tests/test_generated_repair_guest.py
      - name: Check guest entry refusal paths with fake dependencies
        run: python -m pytest tests/test_generated_repair_guest_failures.py
      - name: Check supplied runtime profiles without an engine
        run: python -m pytest tests/test_generated_repair_runtime_profile.py
      - name: Check profile and create-plan refusal paths offline
        run: python -m pytest tests/test_generated_repair_runtime_profile_failures.py
      - name: Check private input staging with inert temporary files
        run: python -m pytest tests/test_generated_repair_staging.py
      - name: Check staging failure and retained-partial paths
        run: python -m pytest tests/test_generated_repair_staging_failures.py
      - name: Check fixed Engine HTTP with fake sockets only
        run: python -m pytest tests/test_generated_repair_engine_http.py tests/test_generated_repair_engine_http_failures.py
      - name: Check runtime metadata with supplied frames only
        run: python -m pytest tests/test_generated_repair_preflight.py tests/test_generated_repair_preflight_failures.py
      - name: Check endpoint bootstrap with synthetic frames and memory sockets
        run: python -m pytest tests/test_generated_repair_bootstrap.py
      - name: Check endpoint bootstrap refusal paths in a fresh interpreter
        run: python -m pytest tests/test_generated_repair_bootstrap_failures.py
      - name: Check pinned image inputs without an engine or package installation
        run: python -m pytest tests/test_generated_image_inputs.py
      - name: Check image input refusal paths in a fresh interpreter
        run: python -m pytest tests/test_generated_image_inputs_failures.py
      - name: Check minimal image contexts with inert local inputs
        run: python -m pytest tests/test_generated_image_context.py
      - name: Check host archive comparison without extraction or image execution
        run: python -m pytest tests/test_generated_image_contents.py
      - name: Check stopped configuration and private phase with fake Engine replies
        run: python -m pytest tests/test_generated_repair_container_inspect.py tests/test_generated_repair_phase.py
      - name: Check bounded pipes with fake and fixed trusted children
        run: python -m pytest tests/test_generated_repair_process.py tests/test_generated_repair_process_integration.py
      - name: Check current private profile input without an engine
        run: python -m pytest tests/test_generated_repair_runtime_input.py
      - name: Check supplied kernel controls without launching a guest
        run: python -m pytest tests/test_generated_repair_kernel_controls.py
      - name: Check active session with inert copies and fake phase results
        run: python -m pytest tests/test_generated_repair_session_live.py
      - name: Check explicit file CLI with fake provider and phase
        run: python -m pytest tests/test_generated_repair_file_cli.py
      - name: Check final apply and restore expiry after durable intent
        run: python -m pytest tests/test_generated_repair_commit_deadline.py

