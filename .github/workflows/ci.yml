name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  proposal-check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Check declaration APIs, review demo and CLI platform boundary
        run: >-
          python -m pytest tests/test_declaration_check.py tests/test_proposal_check_cli.py
          tests/test_review_demo.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test documentation checker
        run: node --test scripts/check_docs.test.mjs
        working-directory: .
      - name: Check documentation links and translations
        run: node scripts/check_docs.mjs
        working-directory: .
      - name: Check documentation formatting
        run: git ls-files -z '*.md' | xargs -0 frontend/node_modules/.bin/prettier --check
        working-directory: .
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
