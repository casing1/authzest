name: Native preview preflight

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character lowercase main commit SHA to check (no publication)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify explicitly selected main commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refuse other events, refs, stale selections, or checkout mismatches
        run: python -I -S scripts/verify_preview_dispatch.py
        env:
          AUTHZEST_PREVIEW_EXPECTED_SHA: ${{ inputs.expected_sha }}

  build:
    needs: guard
    name: Preview build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[build]'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m PyInstaller --clean --noconfirm authzest.spec
      - name: Smoke selected binary and relocated copy (Unix)
        if: runner.os != 'Windows'
        run: python -I -S scripts/smoke_release.py --binary dist/authzest
      - name: Smoke selected binary and relocated copy (Windows)
        if: runner.os == 'Windows'
        run: python -I -S scripts/smoke_release.py --binary dist/authzest.exe
      - name: Package current source version without a release label
        run: python scripts/package_release.py
        env:
          AUTHZEST_RELEASE_TAG: ""
      - name: Verify packaged checksum and smoke relocated artifact
        run: python -I -S scripts/smoke_release.py --artifact-dir release
      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    needs: build
    name: Verify preview download on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: preview-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ runner.arch }}
          path: artifact
      - name: Verify AuthZest is not installed in this fresh runtime
        run: >-
          python -I -c "import importlib.util;
          assert importlib.util.find_spec('authzest') is None, 'AuthZest unexpectedly installed'"
      - name: Check downloaded checksum and previews without installing dependencies
        run: python -I -S scripts/smoke_release.py --artifact-dir artifact
