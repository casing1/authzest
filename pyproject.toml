[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "authguard"
version = "0.1.0"
description = "Source-aware authorization security testing for FastAPI projects"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "AuthGuard contributors" }]
dependencies = [
  "typer>=0.9,<1.0",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]
dev = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pytest>=7.4,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]
build = [
  "fastapi>=0.115,<1.0",
  "pyinstaller>=6.11,<7.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
authguard = "authguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
